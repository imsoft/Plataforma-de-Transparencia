packages:
  - apps/*
  - packages/*

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  # ui
  '@base-ui/react': 1.9.0
  cn: 0.5.0
  node-html-parser: 9.0.5
  qrcode: 1.5.4
  '@types/qrcode': 1.5.6
  server-only: 0.0.1
  cmdk: 1.1.1
  tw-animate-css: 1.4.0
  next-themes: 0.4.6
  sonner: 2.0.8
  shadcn: 4.22.1
  react-dropzone: 20.1.4
  # runtime / framework
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  '@types/node': ^24.0.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # monorepo / tooling
  turbo: 2.11.9
  tsx: 4.23.15
  prettier: 3.9.10
  only-allow: 1.2.2
  eslint: 10.13.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.71.2
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  '@next/eslint-plugin-next': 16.4.2
  globals: 17.13.0
  # css / ui
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  lucide-react: 1.59.0
  class-variance-authority: 0.7.1
  tailwind-merge: 3.7.0
  '@dnd-kit/core': 6.3.1
  react-hook-form: 7.90.0
  '@hookform/resolvers': 5.9.2
  # validation / env
  zod: 4.6.7
  '@t3-oss/env-nextjs': 0.13.11
  '@t3-oss/env-core': 0.13.11
  dotenv: 18.0.8
  # db
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  drizzle-zod: 0.8.3
  postgres: 3.4.9
  '@neondatabase/serverless': 1.2.0
  # auth
  better-auth: 1.7.11
  '@better-auth/drizzle-adapter': 1.7.11
  # files
  '@aws-sdk/client-s3': 3.1152.0
  '@aws-sdk/s3-request-presigner': 3.1152.0
  '@aws-sdk/lib-storage': 3.1152.0
  file-type: 22.2.0
  sharp: 0.35.5
  nanoid: 6.0.2
  archiver: 8.0.0
  exceljs: 4.4.0
  '@types/archiver': 8.0.0
  # email / monitoring
  resend: 6.34.1
  nodemailer: 10.1.7
  '@types/nodemailer': 8.0.2
  '@react-email/components': 1.0.12
  '@sentry/nextjs': 11.8.0
  # tests
  vitest: 5.0.5
  '@playwright/test': 1.64.1
  '@axe-core/playwright': 4.14.0
  # scripts
  '@clack/prompts': 1.8.1
  auth: 1.7.11

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.11'
  - '@better-auth/drizzle-adapter@1.7.11'
  - '@better-auth/kysely-adapter@1.7.11'
  - '@better-auth/memory-adapter@1.7.11'
  - '@better-auth/mongo-adapter@1.7.11'
  - '@better-auth/prisma-adapter@1.7.11'
  - '@better-auth/telemetry@1.7.11'
  - auth@1.7.11
  - better-auth@1.7.11

  # Paquetes con scripts de instalación permitidos (binarios nativos)
  - shadcn@4.22.1
  - nodemailer@10.1.7
  - node-html-parser@9.0.5
