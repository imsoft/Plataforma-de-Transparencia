name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high || true
      - run: cp .env.example .env && cp apps/sitio-tuxcacuesco/.env.example apps/sitio-tuxcacuesco/.env.local
      - run: pnpm docker:up
      - run: pnpm --filter @plataforma/db migrate
      - run: pnpm typecheck
      - run: pnpm typecheck:scripts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm iniciar
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
