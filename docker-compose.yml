# Servicios locales que sustituyen a Neon (Postgres), Cloudflare R2 (RustFS, compatible con S3) y Resend (Mailpit).
# Las apps (panel y sitios) corren fuera de Docker con `pnpm dev`.
name: plataforma-transparencia

services:
  postgres:
    image: postgres:18
    container_name: pt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transparencia
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d transparencia']
      interval: 5s
      timeout: 5s
      retries: 10

  # Bucket S3 local (sustituye a Cloudflare R2). MinIO dejó de publicar imágenes públicas; RustFS es compatible con S3.
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: pt-rustfs
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio12345
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9000/health/live || curl -sf http://localhost:9000/ || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/crear-bucket.sh']
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: transparencia
      ENDPOINT: http://rustfs:9000
    volumes:
      - ./docker/bucket:/init:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: pt-mailpit
    ports:
      - '8025:8025' # interfaz web
      - '1025:1025' # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  rustfs-data:
